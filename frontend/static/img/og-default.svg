<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Miss Universe Nail Art Studio — Elegance at Your Fingertips">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6f1"/>
      <stop offset="1" stop-color="#f3eae2"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6a15b"/>
      <stop offset="0.5" stop-color="#b76e79"/>
      <stop offset="1" stop-color="#9d5763"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative blobs -->
  <circle cx="1010" cy="150" r="200" fill="url(#rose)" opacity="0.9"/>
  <circle cx="1120" cy="470" r="120" fill="#e7c3cb" opacity="0.7"/>
  <text x="985" y="185" font-family="Georgia, serif" font-size="120" text-anchor="middle" fill="#ffffff" opacity="0.9">✦</text>

  <!-- eyebrow -->
  <text x="90" y="220" font-family="'Jost', system-ui, sans-serif" font-size="26" letter-spacing="8"
        fill="#9d5763">NAIL ART STUDIO</text>

  <!-- studio name -->
  <text x="86" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700"
        fill="#2b2028">Miss Universe</text>
  <text x="90" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700"
        fill="#2b2028">Nail Art Studio</text>

  <!-- tagline -->
  <text x="92" y="475" font-family="Georgia, serif" font-style="italic" font-size="40"
        fill="#9d5763">Elegance at Your Fingertips</text>

  <!-- rule -->
  <rect x="92" y="512" width="120" height="4" rx="2" fill="url(#rose)"/>
</svg>
