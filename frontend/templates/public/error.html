{% extends "base.html" %}
{% block title %}Something went wrong — {{ cfg.STUDIO_NAME }} {{ cfg.STUDIO_SUBTITLE }}{% endblock %}
{% block content %}
<section class="section state-page">
  <div class="container">
    <p class="state-page__code">{{ status_code or 500 }}</p>
    <h1 class="state-page__title">Something went wrong</h1>
    <p class="state-page__msg">{{ message or "An unexpected error occurred. Please try again." }}</p>
    <div class="state-page__actions">
      <a href="/" class="btn btn--primary">Back Home</a>
    </div>
  </div>
</section>
{% endblock %}
